<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review - HBnB</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <img src="images/logo.png" alt="HBnB Logo" class="logo">
        <a href="login.html" class="login-button">Login</a>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>

    <!-- Main Content -->
    <main>
        <h1>Add a Review for Place XYZ</h1> <!-- يمكنك استبداله بالديناميكي لاحقًا -->
        <form id="review-form">
            <h2>Add a Review</h2>
            
            <!-- Hidden input to identify the place -->
            <input type="hidden" id="place-id" name="place-id" value="123">

            <label for="review">Your Review:</label>
            <textarea id="review" name="review" required></textarea>

            <label for="rating">Rating:</label>
            <select id="rating" name="rating" required>
                <option value="">Select rating</option>
                <option value="1">1 - Poor</option>
                <option value="2">2 - Fair</option>
                <option value="3">3 - Good</option>
                <option value="4">4 - Very Good</option>
                <option value="5">5 - Excellent</option>
            </select>

            <button type="submit">Submit Review</button>
        </form>
    </main>

    <!-- Footer -->
    <footer>
        &copy; 2025 HBnB. All rights reserved.
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
