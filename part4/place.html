<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Logo" class="logo">
        <nav>
            <a href="index.html" class="login-button">Home</a>
        </nav>
    </header>
    <main>
        <section id="place-details">
            <h2>Beautiful Apartment</h2>
            <p>Host: John Doe</p>
            <p>Price per night: $120</p>
            <p>Description: A cozy apartment in the city center.</p>
            <p>Amenities: WiFi, Kitchen, Air Conditioning</p>
        </section>
        <section id="reviews">
            <div class="review-card">
                <p>Great place! - Alice</p>
                <p>Rating: 5/5</p>
            </div>
        </section>
        <section id="add-review">
            <h2>Add a Review</h2>
            <form id="review-form">
                <label for="review-text">Review:</label>
                <textarea id="review-text" name="review-text" required></textarea>
                <label for="rating">Rating:</label>
                <select id="rating" name="rating" required>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <footer>
        <p>All rights reserved</p>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
